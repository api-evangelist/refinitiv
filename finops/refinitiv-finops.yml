meters:
  - name: licensed_users
    unit: seat
    aggregation: sum
  - name: data_subscription
    unit: month
    aggregation: sum
principles:
  - name: Visibility
    description: Visibility relies on the LSEG invoice and per-product entitlement reports; there is no
      cross-product self-serve usage API.
  - name: Allocation
    description: Allocate by entitled seat, data set, and redistribution scope per the contract; tag each
      licensed user to a cost center.
  - name: Optimization
    description: Optimization happens at renewal — right-size seats, drop unused data sets, and consolidate
      contracts under a single LSEG enterprise agreement.
  - name: Accountability
    description: Owner is the market-data licensing function that holds the LSEG contract; entitlement
      changes route through that owner.
notes: Contract-driven licensing; no public meter list. Generic per-request FOCUS columns and meters
  removed.
