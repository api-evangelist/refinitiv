"""
Refinitiv (LSEG Data & Analytics) GraphQL Schema
Covers real-time market data, historical prices, reference data,
news, ESG scores, and financial calendars for capital markets applications.
"""

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ─────────────────────────────────────────────────────────────
# Root Types
# ─────────────────────────────────────────────────────────────

type Query {
  # Market Data
  quote(ric: String!): Quote
  quotes(rics: [String!]!): [Quote!]!
  snapshot(ric: String!, fields: [String!]): Snapshot

  # Historical Data
  timeSeries(input: TimeSeriesInput!): TimeSeriesResponse
  interday(input: InterdayInput!): InterdayResponse
  intraday(input: IntradayInput!): IntradayResponse

  # Reference Data
  instrument(ric: String!): Instrument
  instruments(filter: InstrumentFilter, page: PageInput): InstrumentConnection
  exchange(mic: String!): Exchange
  exchanges(filter: ExchangeFilter): [Exchange!]!
  currency(code: String!): Currency
  currencies: [Currency!]!
  sector(id: String!): Sector
  sectors: [Sector!]!
  issuer(id: String!): Issuer
  issuers(filter: IssuerFilter, page: PageInput): IssuerConnection

  # Options & Derivatives
  optionChain(underlyingRic: String!, expiry: String): OptionChain
  futuresChain(underlyingRic: String!): FuturesChain

  # Fixed Income
  bond(isin: String!): Bond
  bonds(filter: BondFilter, page: PageInput): BondConnection
  yieldCurve(curveId: String!, date: String): YieldCurve

  # News & Research
  headlines(filter: NewsFilter, page: PageInput): HeadlineConnection
  newsItem(storyId: String!): NewsItem
  analyst(id: String!): Analyst
  analystReports(filter: AnalystReportFilter, page: PageInput): AnalystReportConnection

  # ESG
  esgScore(ric: String!): ESGScore
  esgScores(rics: [String!]!): [ESGScore!]!
  esgControversies(ric: String!, filter: ESGControversyFilter): [ESGControversy!]!

  # Financials
  financials(ric: String!, period: FinancialPeriod, statementType: StatementType): Financials
  incomeStatement(ric: String!, period: FinancialPeriod): IncomeStatement
  balanceSheet(ric: String!, period: FinancialPeriod): BalanceSheet
  cashFlowStatement(ric: String!, period: FinancialPeriod): CashFlowStatement
  estimates(ric: String!): [Estimate!]!

  # Calendar & Events
  earningsCalendar(filter: CalendarFilter): [EarningsEvent!]!
  dividendCalendar(filter: CalendarFilter): [DividendEvent!]!
  economicCalendar(filter: EconomicCalendarFilter): [EconomicEvent!]!
  ipoCalendar(filter: CalendarFilter): [IPOEvent!]!

  # Indices
  index(ric: String!): Index
  indexConstituents(ric: String!, page: PageInput): IndexConstituentConnection

  # Commodities
  commodity(ric: String!): Commodity
  commodities(filter: CommodityFilter): [Commodity!]!

  # Forex
  fxRate(baseCurrency: String!, quoteCurrency: String!): FXRate
  fxRates(pairs: [FXPairInput!]!): [FXRate!]!
  fxHistory(input: FXHistoryInput!): FXHistoryResponse

  # Portfolio & Analytics
  portfolio(id: String!): Portfolio
  portfolios(userId: String!): [Portfolio!]!
  riskAnalytics(ric: String!, input: RiskInput): RiskAnalytics

  # Screener
  equityScreener(filter: EquityScreenerFilter, page: PageInput): EquityScreenerResult
  bondScreener(filter: BondScreenerFilter, page: PageInput): BondScreenerResult

  # Search
  search(query: String!, assetClass: AssetClass, limit: Int): SearchResult
}

type Mutation {
  createPortfolio(input: CreatePortfolioInput!): Portfolio!
  updatePortfolio(id: String!, input: UpdatePortfolioInput!): Portfolio!
  deletePortfolio(id: String!): Boolean!
  addPortfolioHolding(portfolioId: String!, input: HoldingInput!): Holding!
  removePortfolioHolding(portfolioId: String!, holdingId: String!): Boolean!
  createAlert(input: AlertInput!): Alert!
  deleteAlert(id: String!): Boolean!
  createWatchlist(input: CreateWatchlistInput!): Watchlist!
  updateWatchlist(id: String!, input: UpdateWatchlistInput!): Watchlist!
  addToWatchlist(watchlistId: String!, ric: String!): Watchlist!
  removeFromWatchlist(watchlistId: String!, ric: String!): Watchlist!
}

type Subscription {
  priceUpdate(rics: [String!]!): PriceUpdate!
  tradeUpdate(rics: [String!]!): TradeUpdate!
  newsUpdate(filter: NewsFilter): NewsItem!
  alertTriggered(userId: String!): Alert!
}

