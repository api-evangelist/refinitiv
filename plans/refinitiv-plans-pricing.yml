specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Refinitiv
providerId: refinitiv
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Financial Data
  - Market Data
  - LSEG
  - Reference Data
  - Screening
description: Refinitiv (now part of LSEG) does not publish public list prices for its market-data, reference-data,
  screening, or analytics APIs. The LSEG developer portal exposes documentation and SDKs but commercial
  access is licensed through direct sales engagements.
sources:
  - https://developers.lseg.com/
  - https://www.lseg.com/en/data-analytics/products/eikon-trading-software
notes: All Refinitiv/LSEG API products (DataScope, Datastream, Tick History, World-Check One, Real-Time
  SDKs, Workspace APIs) are gated behind enterprise licensing with no published per-tier pricing. Scaffold
  trimmed to a single Contact Sales plan.
plans:
  - id: refinitiv-contact-sales
    name: Contact Sales
    type: enterprise
    description: All Refinitiv/LSEG API products are licensed through LSEG sales. Pricing depends on data
      sets, redistribution rights, user count, and contract term.
    entries:
      - label: Refinitiv / LSEG Data Licensing
        name: data_licensing
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: LSEG Data Library
      - name: Real-Time SDKs
      - name: World-Check One
      - name: Tick History
      - name: Datastream
      - name: DataScope
      - name: Workspace APIs
maintainers:
