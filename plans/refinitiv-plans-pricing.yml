description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: refinitiv-free
    name: Free
    type: freemium
    description: Free entry tier for the Refinitiv API surface. Intended for evaluation, prototyping,
      and low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://api.refinitiv.com
          - wss://api.refinitiv.com
          - https://selectapi.datascope.lseg.com/RestApi/v1
          - https://selectapi.datascope.lseg.com
          - https://product.datastream.com
          - https://api.refinitiv.com/verification/v1
          - https://api.rkd.refinitiv.com
          - https://api-eit.refinitiv.com
        unit: 1
        price: '0.00'
        userMultiplied: false
