specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Refinitiv
providerId: refinitiv
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Financial Data
  - Market Data
  - LSEG
description: Refinitiv/LSEG product rate limits are not centrally published; each product (Real-Time,
  Tick History, World-Check One, DataScope, Workspace) has its own throttling rules documented inside
  its licensed developer portal and contractually negotiated message-rate ceilings.
sources:
  - https://developers.lseg.com/
notes: Public, cross-product rate-limit numbers are unavailable. Limits are per-product and contract-bound.
responseCodes:
  throttled: 429
limits:
  - name: Per-product contractual throttling
    scope: contract
    metric: varies
    limit: 'see product-specific developer portal under https://developers.lseg.com/'
policies:
  - name: Contractual Throughput Caps
    description: Real-time and reference-data products enforce message- or request-rate caps defined in
      the LSEG license; numbers are accessible only after contract execution.
  - name: Per-Product Documentation
    description: Each Refinitiv/LSEG API has its own portal section with limit, retry, and reconnect guidance.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
