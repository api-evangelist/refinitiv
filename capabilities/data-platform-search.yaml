naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Data Platform (RDP) APIs — Search
  description: 'Refinitiv Data Platform (RDP) APIs — Search. 1 operations. Lead operation: Search for Instruments. Self-contained
    Naftiko capability covering one Refinitiv business surface.'
  tags:
  - Refinitiv
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_API_KEY: REFINITIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-platform-search
    baseUri: https://api.refinitiv.com
    description: Refinitiv Data Platform (RDP) APIs — Search business capability. Self-contained, no shared references.
    resources:
    - name: discovery-search-v1
      path: /discovery/search/v1/
      operations:
      - name: searchinstruments
        method: POST
        description: Search for Instruments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.REFINITIV_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-platform-search-rest
    port: 8080
    description: REST adapter for Refinitiv Data Platform (RDP) APIs — Search. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/discovery/search/v1
      name: discovery-search-v1
      description: REST surface for discovery-search-v1.
      operations:
      - method: POST
        name: searchinstruments
        description: Search for Instruments
        call: data-platform-search.searchinstruments
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-platform-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv Data Platform (RDP) APIs — Search. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: search-instruments
      description: Search for Instruments
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: data-platform-search.searchinstruments
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
