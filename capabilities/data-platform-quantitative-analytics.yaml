naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Data Platform (RDP) APIs — Quantitative Analytics
  description: 'Refinitiv Data Platform (RDP) APIs — Quantitative Analytics. 1 operations. Lead operation: Calculate Financial
    Contracts. Self-contained Naftiko capability covering one Refinitiv business surface.'
  tags:
  - Refinitiv
  - Quantitative Analytics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_API_KEY: REFINITIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-platform-quantitative-analytics
    baseUri: https://api.refinitiv.com
    description: Refinitiv Data Platform (RDP) APIs — Quantitative Analytics business capability. Self-contained, no shared
      references.
    resources:
    - name: data-quantitative-analytics-v1-financial-contracts
      path: /data/quantitative-analytics/v1/financial-contracts
      operations:
      - name: calculatefinancialcontracts
        method: POST
        description: Calculate Financial Contracts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.REFINITIV_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-platform-quantitative-analytics-rest
    port: 8080
    description: REST adapter for Refinitiv Data Platform (RDP) APIs — Quantitative Analytics. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/data/quantitative-analytics/v1/financial-contracts
      name: data-quantitative-analytics-v1-financial-contracts
      description: REST surface for data-quantitative-analytics-v1-financial-contracts.
      operations:
      - method: POST
        name: calculatefinancialcontracts
        description: Calculate Financial Contracts
        call: data-platform-quantitative-analytics.calculatefinancialcontracts
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-platform-quantitative-analytics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv Data Platform (RDP) APIs — Quantitative Analytics. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: calculate-financial-contracts
      description: Calculate Financial Contracts
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: data-platform-quantitative-analytics.calculatefinancialcontracts
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
