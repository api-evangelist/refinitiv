naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Data Platform (RDP) APIs — Authentication
  description: 'Refinitiv Data Platform (RDP) APIs — Authentication. 1 operations. Lead operation: Request Access Token. Self-contained
    Naftiko capability covering one Refinitiv business surface.'
  tags:
  - Refinitiv
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_API_KEY: REFINITIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-platform-authentication
    baseUri: https://api.refinitiv.com
    description: Refinitiv Data Platform (RDP) APIs — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: auth-oauth2-v1-token
      path: /auth/oauth2/v1/token
      operations:
      - name: gettoken
        method: POST
        description: Request Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.REFINITIV_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-platform-authentication-rest
    port: 8080
    description: REST adapter for Refinitiv Data Platform (RDP) APIs — Authentication. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/auth/oauth2/v1/token
      name: auth-oauth2-v1-token
      description: REST surface for auth-oauth2-v1-token.
      operations:
      - method: POST
        name: gettoken
        description: Request Access Token
        call: data-platform-authentication.gettoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-platform-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv Data Platform (RDP) APIs — Authentication. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: request-access-token
      description: Request Access Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: data-platform-authentication.gettoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
