naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Data Platform (RDP) APIs — Historical Pricing
  description: 'Refinitiv Data Platform (RDP) APIs — Historical Pricing. 3 operations. Lead operation: Get Historical Pricing
    Events. Self-contained Naftiko capability covering one Refinitiv business surface.'
  tags:
  - Refinitiv
  - Historical Pricing
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_API_KEY: REFINITIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-platform-historical-pricing
    baseUri: https://api.refinitiv.com
    description: Refinitiv Data Platform (RDP) APIs — Historical Pricing business capability. Self-contained, no shared references.
    resources:
    - name: data-historical-pricing-v1-views-events-universe
      path: /data/historical-pricing/v1/views/events/{universe}
      operations:
      - name: gethistoricalpricingevents
        method: GET
        description: Get Historical Pricing Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start
          in: query
          type: string
          description: Start date-time for the data range in ISO 8601 format.
        - name: end
          in: query
          type: string
          description: End date-time for the data range in ISO 8601 format.
        - name: count
          in: query
          type: integer
          description: Maximum number of events to return.
    - name: data-historical-pricing-v1-views-interday-summaries-universe
      path: /data/historical-pricing/v1/views/interday-summaries/{universe}
      operations:
      - name: getinterdaysummaries
        method: GET
        description: Get Interday Pricing Summaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start
          in: query
          type: string
          description: Start date for the historical data range in ISO 8601 format.
        - name: end
          in: query
          type: string
          description: End date for the historical data range in ISO 8601 format.
        - name: count
          in: query
          type: integer
          description: Maximum number of data points to return.
        - name: adjustments
          in: query
          type: string
          description: Comma-separated list of adjustment types to apply such as exchangeCorrection and capitalChange.
    - name: data-historical-pricing-v1-views-intraday-summaries-universe
      path: /data/historical-pricing/v1/views/intraday-summaries/{universe}
      operations:
      - name: getintradaysummaries
        method: GET
        description: Get Intraday Pricing Summaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start
          in: query
          type: string
          description: Start date-time for the data range in ISO 8601 format.
        - name: end
          in: query
          type: string
          description: End date-time for the data range in ISO 8601 format.
        - name: interval
          in: query
          type: string
          description: The interval between data points such as PT1M, PT5M, PT1H.
        - name: count
          in: query
          type: integer
          description: Maximum number of data points to return.
    authentication:
      type: bearer
      token: '{{env.REFINITIV_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-platform-historical-pricing-rest
    port: 8080
    description: REST adapter for Refinitiv Data Platform (RDP) APIs — Historical Pricing. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/data/historical-pricing/v1/views/events/{universe}
      name: data-historical-pricing-v1-views-events-universe
      description: REST surface for data-historical-pricing-v1-views-events-universe.
      operations:
      - method: GET
        name: gethistoricalpricingevents
        description: Get Historical Pricing Events
        call: data-platform-historical-pricing.gethistoricalpricingevents
        with:
          start: rest.start
          end: rest.end
          count: rest.count
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/historical-pricing/v1/views/interday-summaries/{universe}
      name: data-historical-pricing-v1-views-interday-summaries-universe
      description: REST surface for data-historical-pricing-v1-views-interday-summaries-universe.
      operations:
      - method: GET
        name: getinterdaysummaries
        description: Get Interday Pricing Summaries
        call: data-platform-historical-pricing.getinterdaysummaries
        with:
          start: rest.start
          end: rest.end
          count: rest.count
          adjustments: rest.adjustments
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data/historical-pricing/v1/views/intraday-summaries/{universe}
      name: data-historical-pricing-v1-views-intraday-summaries-universe
      description: REST surface for data-historical-pricing-v1-views-intraday-summaries-universe.
      operations:
      - method: GET
        name: getintradaysummaries
        description: Get Intraday Pricing Summaries
        call: data-platform-historical-pricing.getintradaysummaries
        with:
          start: rest.start
          end: rest.end
          interval: rest.interval
          count: rest.count
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-platform-historical-pricing-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv Data Platform (RDP) APIs — Historical Pricing. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: get-historical-pricing-events
      description: Get Historical Pricing Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-platform-historical-pricing.gethistoricalpricingevents
      with:
        start: tools.start
        end: tools.end
        count: tools.count
      outputParameters:
      - type: object
        mapping: $.
    - name: get-interday-pricing-summaries
      description: Get Interday Pricing Summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-platform-historical-pricing.getinterdaysummaries
      with:
        start: tools.start
        end: tools.end
        count: tools.count
        adjustments: tools.adjustments
      outputParameters:
      - type: object
        mapping: $.
    - name: get-intraday-pricing-summaries
      description: Get Intraday Pricing Summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-platform-historical-pricing.getintradaysummaries
      with:
        start: tools.start
        end: tools.end
        interval: tools.interval
        count: tools.count
      outputParameters:
      - type: object
        mapping: $.
