naftiko: 1.0.0-alpha2
info:
  label: Refinitiv LSEG DataScope Select REST API — Authentication
  description: 'Refinitiv LSEG DataScope Select REST API — Authentication. 1 operations. Lead operation: Request Authentication
    Token. Self-contained Naftiko capability covering one Refinitiv business surface.'
  tags:
  - Refinitiv
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_API_KEY: REFINITIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: datascope-select-authentication
    baseUri: https://selectapi.datascope.lseg.com/RestApi/v1
    description: Refinitiv LSEG DataScope Select REST API — Authentication business capability. Self-contained, no shared
      references.
    resources:
    - name: Authentication-RequestToken
      path: /Authentication/RequestToken
      operations:
      - name: requesttoken
        method: POST
        description: Request Authentication Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.REFINITIV_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: datascope-select-authentication-rest
    port: 8080
    description: REST adapter for Refinitiv LSEG DataScope Select REST API — Authentication. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/authentication/requesttoken
      name: authentication-requesttoken
      description: REST surface for Authentication-RequestToken.
      operations:
      - method: POST
        name: requesttoken
        description: Request Authentication Token
        call: datascope-select-authentication.requesttoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: datascope-select-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv LSEG DataScope Select REST API — Authentication. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: request-authentication-token
      description: Request Authentication Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: datascope-select-authentication.requesttoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
