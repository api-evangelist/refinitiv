naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Financial Market Data
  description: Unified workflow capability for financial analysts and quants accessing pricing data, ESG scores, news, and
    instrument search through the Refinitiv Data Platform. Combines historical and real-time pricing with ESG analytics, news,
    and symbology concordance.
  tags:
  - Refinitiv
  - Financial Data
  - Market Data
  - ESG
  - News
  - Analytics
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    RDP_ACCESS_TOKEN: RDP_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: refinitiv-rdp
    baseUri: https://api.refinitiv.com
    description: Refinitiv Data Platform REST API.
    authentication:
      type: bearer
      token: '{{RDP_ACCESS_TOKEN}}'
    resources:
    - name: historical-pricing
      path: /data/historical-pricing/v1/views
      description: Historical pricing data.
      operations:
      - name: get-interday-pricing
        method: GET
        description: Get interday pricing summaries.
        inputParameters:
        - name: universe
          in: path
          type: string
          required: true
          description: Instrument RIC.
        - name: start
          in: query
          type: string
          required: false
          description: Start date ISO 8601.
        - name: end
          in: query
          type: string
          required: false
          description: End date ISO 8601.
        - name: interval
          in: query
          type: string
          required: false
          description: Interval (P1D, P7D, P1M, P3M, P1Y).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-intraday-pricing
        method: GET
        description: Get intraday pricing summaries.
        inputParameters:
        - name: universe
          in: path
          type: string
          required: true
          description: Instrument RIC.
        - name: interval
          in: query
          type: string
          required: false
          description: Intraday interval (PT1M, PT5M, PT30M).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-pricing-events
        method: GET
        description: Get historical pricing events.
        inputParameters:
        - name: universe
          in: path
          type: string
          required: true
          description: Instrument RIC.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pricing-snapshots
      path: /data/pricing/snapshots/v1
      description: Real-time pricing snapshots.
      operations:
      - name: get-pricing-snapshots
        method: GET
        description: Get pricing snapshots for instruments.
        inputParameters:
        - name: universe
          in: path
          type: string
          required: true
          description: Comma-separated RICs.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: news
      path: /data/news/v1
      description: Financial news.
      operations:
      - name: get-news-headlines
        method: GET
        description: Get news headlines.
        inputParameters:
        - name: query
          in: query
          type: string
          required: false
          description: Search query.
        - name: count
          in: query
          type: integer
          required: false
          description: Number of results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-news-story
        method: GET
        description: Get full news story.
        inputParameters:
        - name: storyId
          in: path
          type: string
          required: true
          description: Story identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: esg
      path: /data/environmental-social-governance/v2/views
      description: ESG data.
      operations:
      - name: get-esg-scores
        method: GET
        description: Get basic ESG scores.
        inputParameters:
        - name: universe
          in: query
          type: string
          required: true
          description: Instrument identifiers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-esg-measures
        method: GET
        description: Get full ESG measures.
        inputParameters:
        - name: universe
          in: query
          type: string
          required: true
          description: Instrument identifiers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: symbology
      path: /discovery/symbology/v1/lookup
      description: Identifier concordance.
      operations:
      - name: convert-symbology
        method: POST
        description: Convert between identifier types.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            from: '{{tools.from}}'
            to: '{{tools.to}}'
            universe: '{{tools.universe}}'
    - name: search
      path: /discovery/search/v1
      description: Instrument and entity search.
      operations:
      - name: search-instruments
        method: POST
        description: Search for instruments.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            Query: '{{tools.query}}'
            View: '{{tools.view}}'
            Top: '{{tools.top}}'
  exposes:
  - type: rest
    port: 8080
    namespace: refinitiv-market-data-api
    description: Unified REST API for Refinitiv financial market data.
    resources:
    - path: /v1/pricing/interday/{universe}
      name: interday-pricing
      operations:
      - method: GET
        name: get-interday-pricing
        description: Historical interday pricing summaries.
        call: refinitiv-rdp.get-interday-pricing
        with:
          universe: rest.universe
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pricing/intraday/{universe}
      name: intraday-pricing
      operations:
      - method: GET
        name: get-intraday-pricing
        description: Historical intraday pricing summaries.
        call: refinitiv-rdp.get-intraday-pricing
        with:
          universe: rest.universe
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pricing/snapshots/{universe}
      name: pricing-snapshots
      operations:
      - method: GET
        name: get-pricing-snapshots
        description: Real-time pricing snapshots.
        call: refinitiv-rdp.get-pricing-snapshots
        with:
          universe: rest.universe
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/news/headlines
      name: news-headlines
      operations:
      - method: GET
        name: get-news-headlines
        description: Financial news headlines.
        call: refinitiv-rdp.get-news-headlines
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/esg/scores
      name: esg-scores
      operations:
      - method: GET
        name: get-esg-scores
        description: ESG scores for instruments.
        call: refinitiv-rdp.get-esg-scores
        with:
          universe: rest.universe
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/esg/measures
      name: esg-measures
      operations:
      - method: GET
        name: get-esg-measures
        description: Detailed ESG measures.
        call: refinitiv-rdp.get-esg-measures
        with:
          universe: rest.universe
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/symbology/convert
      name: symbology
      operations:
      - method: POST
        name: convert-symbology
        description: Convert between identifier types.
        call: refinitiv-rdp.convert-symbology
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/search/instruments
      name: instrument-search
      operations:
      - method: POST
        name: search-instruments
        description: Search for instruments.
        call: refinitiv-rdp.search-instruments
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: refinitiv-market-data-mcp
    transport: http
    description: MCP server for AI-assisted Refinitiv financial data access.
    tools:
    - name: get-interday-pricing
      description: Retrieve historical daily/weekly/monthly OHLCV pricing for a financial instrument by RIC.
      hints:
        readOnly: true
        openWorld: false
      call: refinitiv-rdp.get-interday-pricing
      with:
        universe: tools.universe
      outputParameters:
      - type: object
        mapping: $.
    - name: get-intraday-pricing
      description: Retrieve historical intraday pricing at 1, 5, 30, or 60 minute intervals.
      hints:
        readOnly: true
        openWorld: false
      call: refinitiv-rdp.get-intraday-pricing
      with:
        universe: tools.universe
      outputParameters:
      - type: object
        mapping: $.
    - name: get-pricing-snapshot
      description: Get current real-time or delayed pricing snapshot for one or more instruments.
      hints:
        readOnly: true
        openWorld: false
      call: refinitiv-rdp.get-pricing-snapshots
      with:
        universe: tools.universe
      outputParameters:
      - type: object
        mapping: $.
    - name: get-news-headlines
      description: Search and retrieve financial news from Reuters and other sources.
      hints:
        readOnly: true
        openWorld: true
      call: refinitiv-rdp.get-news-headlines
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: get-esg-scores
      description: Retrieve ESG pillar scores for financial instruments.
      hints:
        readOnly: true
        openWorld: false
      call: refinitiv-rdp.get-esg-scores
      with:
        universe: tools.universe
      outputParameters:
      - type: object
        mapping: $.
    - name: convert-symbology
      description: Convert instrument identifiers between ISIN, CUSIP, SEDOL, RIC, and PermID.
      hints:
        readOnly: true
        openWorld: false
      call: refinitiv-rdp.convert-symbology
      with:
        universe: tools.universe
      outputParameters:
      - type: object
        mapping: $.
    - name: search-instruments
      description: Search for instruments, organizations, and economic indicators.
      hints:
        readOnly: true
        openWorld: true
      call: refinitiv-rdp.search-instruments
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
