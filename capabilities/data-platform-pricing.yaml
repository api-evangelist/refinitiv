naftiko: 1.0.0-alpha2
info:
  label: Refinitiv Data Platform (RDP) APIs — Pricing
  description: 'Refinitiv Data Platform (RDP) APIs — Pricing. 2 operations. Lead operation: Get Pricing Snapshots. Self-contained
    Naftiko capability covering one Refinitiv business surface.'
  tags:
  - Refinitiv
  - Pricing
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_API_KEY: REFINITIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-platform-pricing
    baseUri: https://api.refinitiv.com
    description: Refinitiv Data Platform (RDP) APIs — Pricing business capability. Self-contained, no shared references.
    resources:
    - name: data-pricing-snapshots-v1
      path: /data/pricing/snapshots/v1/
      operations:
      - name: getpricingsnapshots
        method: GET
        description: Get Pricing Snapshots
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: universe
          in: query
          type: string
          description: Comma-separated list of instrument identifiers such as RICs.
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-separated list of specific fields to return.
    - name: pricing-chains-v1
      path: /pricing/chains/v1/
      operations:
      - name: getpricingchains
        method: GET
        description: Get Pricing Chains
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: universe
          in: query
          type: string
          description: The chain RIC identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.REFINITIV_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-platform-pricing-rest
    port: 8080
    description: REST adapter for Refinitiv Data Platform (RDP) APIs — Pricing. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/data/pricing/snapshots/v1
      name: data-pricing-snapshots-v1
      description: REST surface for data-pricing-snapshots-v1.
      operations:
      - method: GET
        name: getpricingsnapshots
        description: Get Pricing Snapshots
        call: data-platform-pricing.getpricingsnapshots
        with:
          universe: rest.universe
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pricing/chains/v1
      name: pricing-chains-v1
      description: REST surface for pricing-chains-v1.
      operations:
      - method: GET
        name: getpricingchains
        description: Get Pricing Chains
        call: data-platform-pricing.getpricingchains
        with:
          universe: rest.universe
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-platform-pricing-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv Data Platform (RDP) APIs — Pricing. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-pricing-snapshots
      description: Get Pricing Snapshots
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-platform-pricing.getpricingsnapshots
      with:
        universe: tools.universe
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
    - name: get-pricing-chains
      description: Get Pricing Chains
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-platform-pricing.getpricingchains
      with:
        universe: tools.universe
      outputParameters:
      - type: object
        mapping: $.
