naftiko: 1.0.0-alpha2
info:
  label: Refinitiv LSEG DataScope Select REST API — Schedules
  description: 'Refinitiv LSEG DataScope Select REST API — Schedules. 1 operations. Lead operation: List Extraction Schedules.
    Self-contained Naftiko capability covering one Refinitiv business surface.'
  tags:
  - Refinitiv
  - Schedules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REFINITIV_API_KEY: REFINITIV_API_KEY
capability:
  consumes:
  - type: http
    namespace: datascope-select-schedules
    baseUri: https://selectapi.datascope.lseg.com/RestApi/v1
    description: Refinitiv LSEG DataScope Select REST API — Schedules business capability. Self-contained, no shared references.
    resources:
    - name: Extractions-Schedules
      path: /Extractions/Schedules
      operations:
      - name: listschedules
        method: GET
        description: List Extraction Schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.REFINITIV_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: datascope-select-schedules-rest
    port: 8080
    description: REST adapter for Refinitiv LSEG DataScope Select REST API — Schedules. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/extractions/schedules
      name: extractions-schedules
      description: REST surface for Extractions-Schedules.
      operations:
      - method: GET
        name: listschedules
        description: List Extraction Schedules
        call: datascope-select-schedules.listschedules
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: datascope-select-schedules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Refinitiv LSEG DataScope Select REST API — Schedules. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-extraction-schedules
      description: List Extraction Schedules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: datascope-select-schedules.listschedules
      outputParameters:
      - type: object
        mapping: $.
